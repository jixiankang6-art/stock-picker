<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>A股选股</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F2F2F7;--card:#FFF;--label:#1C1C1E;--label2:#3C3C43;--hint:#8E8E93;--blue:#007AFF;--blue-light:#E5F1FF;--red:#FF3B30;--red-bg:#FFF0EF;--green:#34C759;--green-bg:#E8F8EC;--orange:#FF9500;--gray-2:#E5E5EA}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--label);max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:90px;-webkit-font-smoothing:antialiased}
.nav{background:rgba(255,255,255,.85);backdrop-filter:blur(20px);padding:10px 20px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--gray-2)}
.nav-back{width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.05);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;opacity:0;pointer-events:none;transition:.2s}
.nav-back.show{opacity:1;pointer-events:auto}
.nav-title{font-size:17px;font-weight:600}
.nav-time{font-size:13px;color:var(--hint);display:flex;align-items:center;gap:6px}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 1.5s infinite}
@keyframes pulse{50%{opacity:.4}}
.content{padding:16px}
.section-title{font-size:22px;font-weight:700;margin:8px 0 12px;display:flex;align-items:center;justify-content:space-between}
.section-title small{font-size:13px;font-weight:400;color:var(--hint)}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card h3{font-size:17px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.up{color:var(--red)}.down{color:var(--green)}.flat{color:var(--hint)}
.market-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.market-tile{background:var(--card);border-radius:14px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.market-tile .name{font-size:13px;color:var(--hint)}
.market-tile .val{font-size:22px;font-weight:700;margin:4px 0 2px}
.market-tile .chg{font-size:12px;font-weight:500}
.btn{padding:12px 24px;border-radius:12px;border:none;font-size:15px;font-weight:600;cursor:pointer;transition:.15s}
.btn-primary{background:var(--blue);color:#fff}.btn-block{width:100%;justify-content:center;display:flex;align-items:center;gap:6px}
.btn-secondary{background:var(--blue-light);color:var(--blue);padding:8px 16px;font-size:14px;border-radius:10px}
.sector-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--gray-2);cursor:pointer}
.sector-row:last-child{border-bottom:none}
.sector-info{flex:1}.sector-info .name{font-size:16px;font-weight:600}.sector-info .stars{color:var(--orange);font-size:12px;margin-top:3px}
.sector-stats{text-align:right}.sector-stats .chg{font-size:17px;font-weight:700}.sector-stats .days{font-size:11px;color:var(--hint);margin-top:3px}
.rec-badge{display:inline-flex;align-items:center;gap:3px;background:linear-gradient(135deg,#FFD700,#FFA500);color:#fff;font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;margin-left:6px}
.tag{display:inline-block;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:500;margin:2px 4px 2px 0}
.tag-blue{background:var(--blue-light);color:var(--blue)}.tag-gold{background:#FFF8E1;color:#B45309}.tag-gray{background:var(--gray-2);color:var(--label2)}
.list-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--gray-2);cursor:pointer}
.list-row:last-child{border-bottom:none}
.list-row .avatar{width:36px;height:36px;border-radius:10px;background:var(--blue-light);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex-shrink:0}
.list-row .body{flex:1;min-width:0}.list-row .body .name{font-size:15px;font-weight:600}
.list-row .body .meta{font-size:12px;color:var(--hint);margin-top:2px}
.list-row .right{text-align:right;flex-shrink:0}.list-row .right .price{font-size:15px;font-weight:600}
.list-row .right .chg{font-size:12px;margin-top:2px}
.list-row .right .score{display:inline-block;padding:2px 6px;border-radius:4px;font-size:11px;font-weight:600;background:var(--gray-2);color:var(--label2);margin-top:2px}
.list-row .right .score.high{background:var(--red-bg);color:var(--red)}
.indicators{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.indicator{background:var(--bg);border-radius:10px;padding:10px 12px}.indicator .label{font-size:11px;color:var(--hint)}.indicator .val{font-size:16px;font-weight:600;margin-top:2px}
.advice-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px}
.advice-box{text-align:center;padding:14px;background:var(--bg);border-radius:12px}
.advice-box.buy{background:var(--red-bg)}.advice-box.buy .val{color:var(--red)}.advice-box.stop{background:var(--green-bg)}.advice-box.stop .val{color:var(--green)}
.advice-box .label{font-size:11px;color:var(--hint);margin-bottom:4px}.advice-box .val{font-size:18px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;font-weight:500;color:var(--hint);padding:8px 4px;font-size:11px}td{padding:8px 4px;border-top:1px solid var(--gray-2)}
.tnum{font-variant-numeric:tabular-nums;text-align:right}
.biz-expandable{position:relative;max-height:120px;overflow:hidden;transition:max-height .3s}
.biz-expandable::after{content:'';position:absolute;bottom:0;left:0;right:0;height:40px;background:linear-gradient(transparent,var(--card))}
.biz-expande{max-height:2000px}.biz-expande::after{display:none}
.expand-btn{display:flex;align-items:center;justify-content:center;gap:4px;color:var(--blue);font-size:13px;font-weight:500;cursor:pointer;padding:8px 0}
.search-bar{background:rgba(118,118,128,.12);border-radius:10px;padding:8px 14px;display:flex;align-items:center;gap:8px;font-size:15px;color:var(--hint);margin-bottom:12px}
.search-bar input{background:transparent;border:none;outline:none;flex:1;font-size:15px;color:var(--label)}
.tabbar{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.95);backdrop-filter:blur(20px);border-radius:22px;padding:8px;display:flex;gap:4px;box-shadow:0 4px 24px rgba(0,0,0,.12);border:1px solid var(--gray-2);max-width:460px;width:calc(100% - 24px)}
.tabbar-item{flex:1;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:16px;cursor:pointer;color:var(--hint);transition:.2s}
.tabbar-item.active{background:var(--blue);color:#fff}.tabbar-item .icon{font-size:18px}.tabbar-item .label{font-size:10px;font-weight:500}
.view{display:none}.view.active{display:block}.loading{text-align:center;padding:30px;color:var(--hint)}
.spinner{display:inline-block;width:24px;height:24px;border:3px solid var(--gray-2);border-top-color:var(--blue);border-radius:50%;animation:spin .6s linear infinite;margin-bottom:8px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="nav">
<div class="nav-back" id="navBack" onclick="goBack()">←</div>
<div class="nav-title" id="navTitle">大盘概览</div>
<div class="nav-time"><span class="live-dot"></span>实时</div>
</div>

<div id="view-market" class="view active"><div class="content">
<div class="section-title">A 股 <small>实时</small></div>
<div class="market-grid" id="market-cn"></div>
<div class="section-title" style="margin-top:20px">全球市场</div>
<div class="market-grid" id="market-global"></div>
<div class="loading" id="market-loading"><div class="spinner"></div><p>加载中...</p></div>
</div></div>

<div id="view-sector" class="view"><div class="content">
<div class="section-title">板块行情扫描</div>
<div id="sector-pre" class="card" style="text-align:center;padding:32px">
<div style="font-size:38px;margin-bottom:12px">🔍</div>
<p style="font-size:14px;color:var(--hint);margin-bottom:16px">检测连续上涨≥2天的板块</p>
<button class="btn btn-primary btn-block" onclick="scanSectors()" id="scan-btn">开始扫描</button>
<p id="sector-status" style="font-size:12px;color:var(--hint);margin-top:10px"></p>
</div>
<div id="sector-result" style="display:none">
<div class="section-title">符合条件 <small id="sector-count">0 个板块</small></div>
<div class="card" id="sector-list"></div>
</div>
</div></div>

<div id="view-stock" class="view"><div class="content">
<div class="section-title" id="stock-title">请从板块扫描进入</div>
<div id="stock-content"></div>
</div></div>

<div id="view-analyze" class="view"><div class="content"><div class="search-bar"><span>🔍</span><input id="stock-code-input" placeholder="输入6位代码" maxlength="6"><button class="btn-secondary" onclick="doAnalyze()">分析</button></div>
<div id="analyze-content"><div class="card" style="text-align:center;padding:40px"><p style="color:var(--hint)">从板块或选股中点击股票进入分析</p></div></div>
</div></div>

<div class="tabbar">
<div class="tabbar-item active" data-view="market"><div class="icon">📊</div><div class="label">大盘</div></div>
<div class="tabbar-item" data-view="sector"><div class="icon">🔍</div><div class="label">板块</div></div>
<div class="tabbar-item" data-view="stock"><div class="icon">📋</div><div class="label">选股</div></div>
<div class="tabbar-item" data-view="analyze"><div class="icon">📈</div><div class="label">分析</div></div>
</div>

<script>
var curView='market',curSector=null,stockCacheHTML=null;
var viewNames={market:'大盘概览',sector:'板块扫描',stock:'选股',analyze:'个股分析'};

function sw(v){
  curView=v;
  document.querySelectorAll('.tabbar-item').forEach(function(i){i.classList.remove('active')});
  document.querySelectorAll('.view').forEach(function(v){v.classList.remove('active')});
  var item=document.querySelector('.tabbar-item[data-view="'+v+'"]');if(item)item.classList.add('active');
  document.getElementById('view-'+v).classList.add('active');
  document.getElementById('navTitle').textContent=viewNames[v]||'A股选股';
  document.getElementById('navBack').classList.toggle('show',v==='stock'||v==='analyze');
  window.scrollTo(0,0);
  if(v==='market')loadMarket();
}
function gb(){if(curView==='analyze')sw('stock');else if(curView==='stock')sw('sector');}

document.querySelectorAll('.tabbar-item').forEach(function(i){i.addEventListener('click',function(){sw(this.dataset.view)});});

// API 封装
function api(p){return fetch(p).then(function(r){return r.json()});}

// ===== 大盘 =====
async function loadMarket(){
  var ld=document.getElementById('market-loading');
  try{
    var d=await api('/api/market');if(d.code!==0)return;
    var cn=[],gl=[];
    d.data.forEach(function(i){
      var r=i.region||'A股';
      var cls=i.change_pct>=0?'up':i.change_pct===0?'flat':'down';
      var t='<div class="market-tile"><div class="name">'+i.name+'</div><div class="val '+cls+'">'+i.price.toFixed(2)+'</div><div class="chg '+cls+'">'+(i.change_pct>=0?'+':'')+i.change_pct.toFixed(2)+'%</div></div>';
      if(r==='A股')cn.push(t);else gl.push(t);
    });
    ld.style.display='none';
    document.getElementById('market-cn').innerHTML=cn.join('');
    document.getElementById('market-global').innerHTML=gl.join('')+'<div class="market-tile" style="opacity:.5"><div class="name">日经/韩国综指</div><div class="val flat">--</div><div class="chg flat">暂不支持</div></div>';
  }catch(e){ld.innerHTML='<p>加载失败</p>'}
}

// ===== 板块扫描 =====
async function scanSectors(){
  var btn=document.getElementById('scan-btn');btn.disabled=true;btn.innerHTML='<span class="spinner"></span>扫描中...';
  document.getElementById('sector-status').textContent='正在检查 31 个申万一级行业...';
  try{
    var d=await api('/api/sectors');
    if(d.code!==0||!d.data.length){document.getElementById('sector-status').textContent='暂无符合条件的板块';btn.disabled=false;btn.textContent='重新扫描';return;}
    document.getElementById('sector-pre').style.display='none';
    document.getElementById('sector-result').style.display='block';
    document.getElementById('sector-count').textContent=d.data.length+' 个板块';
    var html='';d.data.forEach(function(s){
      var days=Math.min(s['连续流入天数'],5),stars='★'.repeat(days)+'☆'.repeat(Math.max(5-days,0));
      var rec=days>=4;
      html+='<div class="sector-row" onclick="pickSector(\''+s['板块名称']+'\')"><div class="sector-info"><div class="name">'+s['板块名称']+(rec?' <span class="rec-badge">⭐ 优选</span>':'')+'</div><div class="stars">'+stars+' '+s['连续流入天数']+' 天</div></div><div class="sector-stats"><div class="chg '+(s['涨跌幅']>=0?'up':'down')+'">'+(s['涨跌幅']>=0?'+':'')+s['涨跌幅']+'%</div><div class="days">连续 '+s['连续流入天数']+' 天</div></div></div>';
    });
    document.getElementById('sector-list').innerHTML=html;
  }catch(e){document.getElementById('sector-status').textContent='扫描失败';btn.disabled=false;btn.textContent='重新扫描';}
}

// ===== 选股 =====
async function pickSector(name){
  curSector=name;document.getElementById('navTitle').textContent=name+' · 选股';
  document.getElementById('stock-title').textContent=name+' · 加载中...';
  document.getElementById('stock-content').innerHTML='<div class="loading"><div class="spinner"></div></div>';
  sw('stock');
  try{
    var d=await api('/api/sector/'+encodeURIComponent(name)+'/stocks');
    if(d.code!==0||!d.data.length){document.getElementById('stock-content').innerHTML='<div class="card"><p style="color:var(--hint)">暂无成分股数据</p></div>';return;}
    var all=d.data,rec=[],nrec=[];
    all.forEach(function(s){if(s['评分']>=60&&s['名称'].indexOf('ST')<0)rec.push(s);else nrec.push(s);});
    var html='';
    if(rec.length){
      html+='<div class="card" style="border:2px solid #FFD700;position:relative"><div style="position:absolute;top:-11px;left:16px;background:linear-gradient(135deg,#FFD700,#FFA500);color:#fff;padding:2px 12px;border-radius:8px;font-size:12px;font-weight:700">⭐ 精选推荐 · '+rec.length+' 只</div><div style="margin-top:10px">';
      rec.forEach(function(s){html+=stockRow(s);});
      html+='</div></div>';
    }
    html+='<div class="card" style="margin-top:8px"><h3>📋 全部成分股 · '+all.length+' 只</h3>';
    all.forEach(function(s){html+=stockRow(s);});
    html+='</div>';
    document.getElementById('stock-content').innerHTML=html;
    document.getElementById('stock-title').textContent=name+' · '+(rec.length?'精选 '+rec.length+' 只':'成分股')+' <span id="score-status" style="font-size:11px;color:var(--orange);font-weight:500">评分计算中...</span>';
    stockCacheHTML=html;
    // 异步评分
    scoreAndRefresh(name,all);
  }catch(e){document.getElementById('stock-content').innerHTML='<p style="color:var(--hint)">加载失败</p>';}
}

var scoreTimer=0;
async function scoreAndRefresh(name,stocks){
  clearTimeout(scoreTimer);
  var statusEl=document.getElementById('score-status');if(statusEl)statusEl.textContent='评分计算中...';
  var top=stocks.slice(0,20),codes=top.map(function(s){return s['代码']});
  var scored={},done=0;
  for(var i=0;i<codes.length;i++){
    try{var r=await fetch('/api/kline/'+codes[i]+'?days=120');var d=await r.json();if(d.code===0){var kd=d.data,kl=kd.klines_120d||kd.klines_60d||kd.klines_20d||[];
    var closes=kl.map(function(k){return k.close}),volumes=kl.map(function(k){return k.volume});
    var cur=top[i]['最新价']||closes[closes.length-1]||0,c20=closes.slice(-20),c60=closes.slice(-60),c120=closes.slice(-120);
    var s=0,cons=0;for(var j=c20.length-1;j>0;j--){if(c20[j]>c20[j-1])cons++;else break;}if(cur>c20[c20.length-1])cons++;
    s+=Math.min(cons*6,25);
    if(c20.length>=6){var chg5=(c20[c20.length-1]-c20[c20.length-6])/c20[c20.length-6]*100;s+=Math.min(Math.max(Math.floor(chg5*3+5),0),15)}
    if(c60.length){var ma60=c60.reduce(function(a,b){return a+b},0)/c60.length;var dev=(cur-ma60)/ma60*100;s+=(dev>=-5&&dev<=5)?15:(dev>=-15&&dev<=15)?10:5}
    if(volumes.length>=5){var avgV=volumes.slice(-5).reduce(function(a,b){return a+b},0)/5;var vr=volumes[volumes.length-1]/avgV;s+=vr>1.5?12:vr>1.2?8:vr>0.8?4:0}
    if(top[i]['名称'].indexOf('ST')<0)s+=5;if(c20.length>=20&&c60.length){if(c20.reduce(function(a,b){return a+b},0)/c20.length>ma60)s+=5}
    if(c120.length>=2&&c120[c120.length-1]>c120[0])s+=5;s+=5;scored[codes[i]]=s;}}catch(e){}
  }
  // 更新DOM评分
  var rows=document.querySelectorAll('#stock-content .list-row');
  var rowMap={};rows.forEach(function(r){var c=r.querySelector('.meta');if(c){var code=c.textContent.trim().split(' · ')[0];if(code)rowMap[code]=r;}});
  Object.keys(scored).forEach(function(code){
    var score=scored[code],row=rowMap[code];if(!row)return;
    var name=row.querySelector('.body .name');var nameText=name?name.textContent:'';
    var isST=nameText.indexOf('ST')>=0,rec=score>=60&&!isST;
    var scoreEl=row.querySelector('.score');if(scoreEl){scoreEl.textContent=score;scoreEl.className='score'+(rec?' high':'');}
    var avatar=row.querySelector('.avatar');if(rec&&avatar){avatar.style.background='#FFF8E1';avatar.style.color='#B45309';}
    if(name){
      var existBadge=name.querySelector('.tag-gold');if(rec&&!existBadge){name.innerHTML=nameText+' <span class="tag tag-gold">⭐ '+score+'分</span>';}
      else if(!rec&&existBadge){name.innerHTML=nameText;}
    }
  });
  // 刷新顶部精选区
  refreshRecommend(stocks,scored);
}

function refreshRecommend(stocks,scored){
  var rec=[],nrec=[];stocks.forEach(function(s){var sc=scored[s['代码']]||0;s['评分']=sc;if(sc>=60&&s['名称'].indexOf('ST')<0)rec.push(s);else nrec.push(s);});
  var html='';
  if(rec.length){
    html+='<div class="card" style="border:2px solid #FFD700;position:relative"><div style="position:absolute;top:-11px;left:16px;background:linear-gradient(135deg,#FFD700,#FFA500);color:#fff;padding:2px 12px;border-radius:8px;font-size:12px;font-weight:700">⭐ 精选推荐 · '+rec.length+' 只</div><div style="margin-top:10px">';
    rec.forEach(function(s){html+=stockRow(s);});html+='</div></div>';
  }
  html+='<div class="card" style="margin-top:8px"><h3>📋 全部成分股 · '+stocks.length+' 只</h3>';
  stocks.sort(function(a,b){return b['评分']-a['评分']});
  stocks.forEach(function(s){html+=stockRow(s);});
  html+='</div>';
  document.getElementById('stock-content').innerHTML=html;
  stockCacheHTML=html;
  document.getElementById('stock-title').textContent=curSector+' · '+(rec.length?'精选 '+rec.length+' 只':'成分股');
}

function stockRow(s){
  var initial=s['名称'].charAt(0),cls=s['涨跌幅']>=0?'up':'down';
  var score=s['评分']||0,rec=score>=60&&s['名称'].indexOf('ST')<0;
  return '<div class="list-row" onclick="quickAnalyze(\''+s['代码']+'\')"><div class="avatar"'+(rec?' style="background:#FFF8E1;color:#B45309"':'')+'>'+initial+'</div><div class="body"><div class="name">'+s['名称']+(rec?' <span class="tag tag-gold">⭐ '+score+'分</span>':'')+'</div><div class="meta">'+s['代码']+'</div></div><div class="right"><div class="price '+cls+'">'+(s['涨跌幅']>=0?'+':'')+s['涨跌幅']+'%</div><div class="score'+(rec?' high':'')+'">'+score+'</div></div></div>';
}

function quickAnalyze(code){document.getElementById('stock-code-input').value=code;doAnalyze();}

// ===== 分析 =====
async function doAnalyze(){
  var code=document.getElementById('stock-code-input').value.trim();
  if(!code||code.length!==6)return alert('请输入6位股票代码');
  document.getElementById('navTitle').textContent='分析中...';
  document.getElementById('analyze-content').innerHTML='<div class="loading"><div class="spinner"></div><p>加载中...</p></div>';
  sw('analyze');
  try{
    var d=await api('/api/stock/'+code);
    if(d.code!==0){document.getElementById('analyze-content').innerHTML='<p style="color:var(--hint)">分析失败: '+d.msg+'</p>';return;}
    var a=d.data,price=a['最新价']||0,chg=0,changeTxt='';
    try{var q=await api('/api/market');}catch(e){}
    document.getElementById('navTitle').textContent=a['股票简称']+' ('+code+')';
    var cls=parseFloat(a['3日涨幅']||0)>=0?'up':'down';
    var html='<div class="card"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div><div style="font-size:22px;font-weight:700">'+a['股票简称']+'</div><div style="font-size:13px;color:var(--hint);margin-top:2px">'+code+' · '+(a['所属行业']||curSector||'')+'</div></div><div style="text-align:right"><div style="font-size:26px;font-weight:700" class="'+cls+'">'+price+'</div><div class="'+(a['3日涨幅']>=0?'up':'down')+'" style="font-size:13px">'+(a['3日涨幅']>=0?'+':'')+(a['3日涨幅']||0)+'%</div></div></div><div style="margin-top:8px"><span class="tag tag-blue">'+a['市值量级']+'</span><span class="tag tag-gray">连续'+(a['连续上涨天数']||0)+'天</span></div></div>';
    html+='<div class="card"><h3>行情指标</h3><div class="indicators">';
    html+=ind('换手率',(a['换手率']||0)+'%')+ind('量比',a['量比']||'-')+ind('3日涨幅','<b class="'+(a['3日涨幅']>=0?'up':'down')+'">'+(a['3日涨幅']>=0?'+':'')+(a['3日涨幅']||0)+'%</b>')+ind('5日涨幅','<b class="'+(a['5日涨幅']>=0?'up':'down')+'">'+(a['5日涨幅']>=0?'+':'')+(a['5日涨幅']||0)+'%</b>');
    html+=ind('MA5',a['MA5']||'-')+ind('MA10',a['MA10']||'-')+ind('MA20',a['MA20']||'-')+ind('60日均价',a['60日均价']||'-');
    html+='</div>';
    if(a['筹码信号'])html+='<div style="margin-top:10px;padding:10px;background:var(--blue-light);border-radius:10px;font-size:13px;color:var(--blue)">📊 '+a['筹码信号']+'（偏离'+a['偏离60日线']+'）</div>';
    html+='</div>';
    // 业务
    if(a['公司简介']||a['经营范围']){
      html+='<div class="card"><h3>📖 公司业务</h3><div class="biz-expandable" id="biz-text"><div style="font-size:13px;line-height:1.7;color:var(--label2)">';
      if(a['公司简介'])html+='<p style="margin-bottom:10px">'+a['公司简介']+'</p>';
      if(a['经营范围'])html+='<div style="margin-top:10px;padding:10px;background:var(--bg);border-radius:10px"><div style="font-size:12px;color:var(--hint);margin-bottom:4px">经营范围</div><div style="font-size:12px">'+a['经营范围']+'</div></div>';
      html+='</div></div><div class="expand-btn" onclick="toggleBiz()"><span id="biz-arrow">展开全文</span></div></div>';
    }
    // K线
    var k5=a['近5日K线'];if(k5&&k5.length){
      html+='<div class="card"><h3>近5日K线</h3><table><thead><tr><th>日期</th><th class="tnum">开盘</th><th class="tnum">高</th><th class="tnum">低</th><th class="tnum">收</th></tr></thead><tbody>';
      k5.forEach(function(k){var u=k.close>=k.open;html+='<tr><td>'+k.date+'</td><td class="tnum">'+k.open+'</td><td class="tnum">'+k.high+'</td><td class="tnum">'+k.low+'</td><td class="tnum '+(u?'up':'down')+'">'+k.close+'</td></tr>';});
      html+='</tbody></table></div>';
    }
    // 交易建议
    try{var ad=await api('/api/stock/'+code+'/advise');if(ad.code===0&&ad.data['建议买点']!=='数据不足'){var t=ad.data;html+=adviceHTML(t);}}catch(e){}
    html+='</div>';
    document.getElementById('analyze-content').innerHTML=html;
  }catch(e){document.getElementById('analyze-content').innerHTML='<p style="color:var(--hint)">分析失败: '+e.message+'</p>';}
}

function ind(label,val){return '<div class="indicator"><div class="label">'+label+'</div><div class="val">'+val+'</div></div>';}
function adviceHTML(t){
  var h='<div class="card"><h3>💰 交易建议 <span style="font-weight:400;font-size:12px;color:var(--hint)">'+(t.ATR?'ATR(14): '+t.ATR.toFixed(3):'')+'</span></h3><div class="advice-row">';
  h+='<div class="advice-box buy"><div class="label">建议买点</div><div class="val">'+t['建议买点']+'</div></div>';
  h+='<div class="advice-box stop"><div class="label">止损价</div><div class="val">'+t['止损价']+'</div></div>';
  h+='<div class="advice-box"><div class="label">盈亏比</div><div class="val">'+t['盈亏比']+'</div></div></div>';
  if(t['止盈档位']&&t['止盈档位'].length){
    h+='<table><thead><tr><th>档位</th><th class="tnum">价格</th><th class="tnum">涨幅</th><th>操作</th></tr></thead><tbody>';
    t['止盈档位'].forEach(function(tp,i){h+='<tr><td>'+(i+1)+'</td><td class="tnum">'+tp['价格']+'</td><td class="tnum up">'+tp['涨幅']+'</td><td>'+tp['说明']+'</td></tr>';});
    h+='</tbody></table>';
  }
  if(t['风险提示']&&t['风险提示'].length)h+='<div style="margin-top:10px">'+t['风险提示'].map(function(r){return '<span class="tag" style="background:#FEF3C7;color:#92400E">⚠ '+r+'</span>'}).join(' ')+'</div>';
  h+='</div>';return h;
}
function toggleBiz(){var el=document.getElementById('biz-text'),btn=document.getElementById('biz-arrow');if(el.classList.contains('biz-expande')){el.classList.remove('biz-expande');btn.textContent='展开全文';}else{el.classList.add('biz-expande');btn.textContent='收起';}}

// 初始化
loadMarket();
document.getElementById('stock-code-input').addEventListener('keydown',function(e){if(e.key==='Enter')doAnalyze();});
</script>
</body>
</html>
